<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F4D6D4" />
  <meta name="color-scheme" content="light" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="记账本" />
  <meta name="description" content="粉色磨砂记账本。生活费、奖学金、助学金和小金库，记在这台设备上。" />
  <title>记账本</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Jost:wght@300;400&family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="bg" id="bg" data-theme="rose" style="--veil: 0.38" aria-hidden="true">
    <div class="bg-photo"></div>
    <div class="bg-veil"></div>
  </div>
  <script>
    try {
      var saved = JSON.parse(localStorage.getItem('jizhang.bg.v1') || 'null');
      var theme = saved && saved.kind === 'sakura' ? 'sakura' : saved && saved.kind === 'upload' ? 'custom' : 'rose';
      var veil = saved && typeof saved.veil === 'number' ? Math.min(1, Math.max(0, saved.veil)) : 0.38;
      var bg = document.getElementById('bg');
      bg.dataset.theme = theme;
      bg.style.setProperty('--veil', String(veil));
    } catch (e) {}
  </script>
  <div id="app"></div>
  <noscript>记账本需要开启 JavaScript。数据只会留在这台设备上。</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
